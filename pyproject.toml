[project]
name = "zzz-bot"
version = "0.1.25"
description = "Desktop automation bot for Zenless Zone Zero HoYoLab daily tasks"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.14.0",
    "apprise==1.10.0",
    "fastapi==0.136.3",
    "fastmcp>=0.1.0",
    "jinja2==3.1.6",
    "numpy==2.2.6",
    "opencv-python==4.13.0.92",
    "playwright==1.60.0",
    "plyer==2.1.0",
    "pydantic==2.13.4",
    "requests==2.34.2",
    "schedule==1.2.2",
    "starlette==0.49.3",
    "sentry-sdk[fastapi]>=2.60.0",
    "pymongo>=4.17.0",
    "uvicorn==0.47.0",
    "winotify==1.1.0",
    "wsproto>=1.3.2",
]

[dependency-groups]
dev = [
    "pillow==12.2.0",
    "pyinstaller==6.16.0",
    "pyinstaller-hooks-contrib==2025.9",
    "pytest==9.0.3",
    "pytest-base-url==2.1.0",
    "pytest-playwright==0.8.0",
    "ruff>=0.14",
    "setuptools==80.9.0",
]

[tool.uv]
default-groups = []

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["backend/playwright-browsers", "product"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.per-file-ignores]
# Package __init__.py files intentionally re-export submodule symbols via star imports.
"**/__init__.py" = ["F403", "F405"]
# These modules adjust sys.path before importing project packages.
"backend/test/*" = ["E402"]
"backend/mcp_tools/inspector.py" = ["E402"]
