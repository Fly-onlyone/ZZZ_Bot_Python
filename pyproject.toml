[project]
name = "zzz-bot"
version = "0.1.0"
description = "Desktop automation bot for Zenless Zone Zero HoYoLab daily tasks"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9.0",
    "apprise==1.9.5",
    "fastapi==0.120.4",
    "fastmcp>=0.1.0",
    "jinja2==3.1.6",
    "numpy==2.2.6",
    "opencv-python==4.12.0.88",
    "playwright==1.55.0",
    "plyer==2.1.0",
    "pydantic==2.12.3",
    "requests==2.32.5",
    "schedule==1.2.2",
    "starlette==0.49.3",
    "pymongo>=4.0",
    "sentry-sdk[fastapi]>=2.0",
    "uvicorn==0.38.0",
    "winotify==1.1.0",
    "wsproto>=1.3.2",
]

[dependency-groups]
dev = [
    "graphviz>=0.20.3",
    "pillow==12.0.0",
    "pyinstaller==6.16.0",
    "pyinstaller-hooks-contrib==2025.9",
    "pytest==8.4.2",
    "pytest-base-url==2.1.0",
    "pytest-playwright==0.7.1",
    "setuptools==80.9.0",
]

[tool.uv]
default-groups = []
